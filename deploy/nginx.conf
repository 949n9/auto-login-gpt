user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 仅供内网登录服务验证账号密码，不发布此端口。
    server {
        listen 8081;
        server_name _;
        auth_basic "toSub2 verifier";
        auth_basic_user_file /etc/nginx/access.htpasswd;
        location = /verify {
            root /usr/share/nginx/html;
            try_files /50x.html =404;
        }
        location / { return 404; }
    }

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16m;
        set $login_backend http://login:4410;
        set $app_backend http://app:4399;

        location = /login {
            proxy_pass $login_backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-Method "";
            proxy_set_header X-Original-Origin "";
        }
        location ^~ /login-assets/ {
            proxy_pass $login_backend$request_uri;
            proxy_set_header Host $http_host;
        }
        location = /auth/login {
            client_max_body_size 8k;
            proxy_pass $login_backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-Method "";
            proxy_set_header X-Original-Origin "";
        }
        location = /auth/logout {
            client_max_body_size 8k;
            proxy_pass $login_backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-Method "";
            proxy_set_header X-Original-Origin "";
        }
        location = /auth/status {
            proxy_pass $login_backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location ^~ /auth/ { return 404; }

        location = /_tosub2_auth {
            internal;
            proxy_pass $login_backend/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-Origin $http_origin;
        }

        # 重登桥接仅供 Compose 内网通过独立密钥访问。
        location ^~ /api/integrations/crs/ { return 404; }

        location ^~ /api/ {
            auth_request /_tosub2_auth;
            error_page 401 = @api_unauthorized;
            proxy_pass $app_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:4399;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization "";
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_body_timeout 600s;
        }
        location / {
            auth_request /_tosub2_auth;
            error_page 401 = @login_redirect;
            proxy_pass $app_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:4399;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization "";
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_body_timeout 600s;
        }
        location @login_redirect { return 303 /login; }
        location @api_unauthorized {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 401 '{"error":"authentication_required"}';
        }
    }
}
